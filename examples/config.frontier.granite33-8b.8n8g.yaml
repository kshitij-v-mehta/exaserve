# Frontier Granite scale configuration.  The checked-in values reproduce the
# qualified eight-node/eight-GCD run.  To scale, change only num_nodes and
# num_gpus_per_node.  With num_replicas omitted, ExaServe fills every declared
# GCD with one independent TP=1 replica.

validation_mode: true
num_nodes: 8
num_gpus_per_node: 8
node_cpus: 56
ray_port: 6379
deployment_name: exaserve_frontier_granite33_8b
replica_max_ongoing_requests: 16
collect_stats: false
engine: vllm
vendor: rocm
accelerator: mi250x-gcd
request_mode: chat
streaming_mode: non_streaming

models:
  - model_id: ibm-granite/granite-3.3-8b-instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.80
    enforce_eager: true
    enable_log_requests: false
    max_num_seqs: 16
    num_cpus_per_replica: 4

exposure:
  mode: PROXIED_INTERNAL
  advertised_scheme: http
  advertised_path: /v1
  network_boundary: trusted_allocation
  request_body_limit_bytes: 16777216

gateway:
  kind: haproxy
  port: 4001
  backend_port: 8000
  executable_ref: PATH:haproxy
  worker_count: 1
  options:
    balance: leastconn
    check_interval: 5000
    check_fall: 3
    check_rise: 2
    stats_port: 9999
    maxconn: 4096

runtime:
  null_compute: false
  null_compute_latency_s: 1.0
  instrumentation: false
  pp_shard_aware: false
  clean_stage: false
